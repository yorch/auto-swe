services:
  watchtower:
    # Pinned: an unpinned tag re-pulls whatever `latest` is on every restart,
    # which for the container that redeploys the rest of the stack is the one
    # place a surprise upgrade is least welcome. Dependabot bumps it.
    image: containrrr/watchtower:${WATCHTOWER_VERSION:-1.7.1}
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_SCOPE: ${WATCHTOWER_SCOPE:-auto-swe}
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_POLL_INTERVAL: ${WATCHTOWER_POLL_INTERVAL:-300}

  gateway:
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "com.centurylinklabs.watchtower.scope=${WATCHTOWER_SCOPE:-auto-swe}"

  worker:
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "com.centurylinklabs.watchtower.scope=${WATCHTOWER_SCOPE:-auto-swe}"

  web:
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "com.centurylinklabs.watchtower.scope=${WATCHTOWER_SCOPE:-auto-swe}"
