# Application stack — NOT runnable standalone.
# Services here reference infra (postgres, temporal) defined in docker-compose.infra.yml.
# Always overlay both files: `docker compose -f docker-compose.infra.yml -f docker-compose.yml ...`
# Use the `yarn docker:up` / `docker:down` / `docker:logs` / `docker:build` scripts for the
# full stack, or `yarn docker:infra:up` for infra only.
services:
  gateway:
    build:
      context: .
      dockerfile: packages/gateway/Dockerfile
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/engineering_system
      - TEMPORAL_ADDRESS=temporal:7233
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET}
      - JWT_SECRET=${JWT_SECRET:-dev-secret-change-me}
      - SLACK_CLIENT_ID=${SLACK_CLIENT_ID:-}
      - SLACK_CLIENT_SECRET=${SLACK_CLIENT_SECRET:-}
      - SLACK_SIGNING_SECRET=${SLACK_SIGNING_SECRET:-}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-lgtm:4317
      - PORT=8080

  worker:
    build:
      context: .
      dockerfile: packages/worker/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/engineering_system
      - TEMPORAL_ADDRESS=temporal:7233
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-lgtm:4317
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock  # DinD access

  # Observability: Grafana LGTM (Grafana + Tempo + Loki + Prometheus + OTel Collector)
  otel-lgtm:
    image: grafana/otel-lgtm:0.8.1
    ports:
      - "3001:3000"   # Grafana UI (3000 taken by Next.js)
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP

  # Phase 4: Web Dashboard
  web:
    build:
      context: .
      dockerfile: packages/web/Dockerfile
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - gateway
    environment:
      - NEXT_PUBLIC_API_URL=http://gateway:8080
