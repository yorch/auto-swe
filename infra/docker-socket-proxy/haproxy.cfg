# Docker API filter in front of the host socket (the `docker-socket-proxy`
# service). The worker reaches the daemon only through this, so it never holds
# the socket. Every request is refused unless its path is in the allowlist
# below; the method is not restricted, because the worker creates, starts,
# copies into and deletes containers.
#
# Allowed, and what in the worker needs each:
#   _ping, version   the CLI's API version negotiation
#   containers       `docker run`/`rm`/`port`/`pause`, `cp` (the archive endpoint),
#                    attach and wait for a foreground run, exec create, and the
#                    label-filtered `docker ps` (GET /containers/json) of the
#                    orphaned-workspace sweep
#   exec             `docker exec` start and inspect
# Within each group only the bulk and exfiltrating operations below are
# refused; everything else in it passes (`containers` also allows kill).
#   images           the pull on a first `docker run` of an executor image
#   volumes          `docker volume create|rm` for container steps
# Everything else is denied: build, networks, swarm, services, secrets,
# configs, plugins, nodes, system, info, events, auth, session, distribution.
# Joining a network by name is resolved by the daemon inside the create call,
# not through the networks API. A new Docker operation in the worker needs its
# path here; the CI proxy test step runs the worker's Docker calls through
# this file.
#
# This limits the API surface, NOT the options of a container the worker is
# allowed to create: see the Limitations in docs/deployment.md.

global
    log stdout format raw local0 info

defaults
    mode http
    log global
    option httplog
    option dontlognull
    timeout connect 10s
    timeout http-request 10s
    timeout http-keep-alive 10s
    # A foreground `docker run` waits on /containers/{id}/wait, and a quiet
    # `docker exec` stream sends nothing for minutes. Both are idle on the wire
    # until the step ends, so these must outlast the longest step (1 h in the
    # spec) or the proxy cuts them off mid-run.
    timeout client 65m
    timeout server 65m
    timeout tunnel 65m

frontend docker
    bind :2375
    # Docker never sends a dot segment or an encoded slash. Refuse them outright
    # rather than rely on how the daemon's router would resolve one behind an
    # allowed prefix (`/containers/x/../../info`). Regexes are single-quoted so
    # haproxy neither unescapes `\.` nor expands `$`.
    http-request deny if { path -m reg -i '(^|/)(\.|%2e){1,2}(/|$)' }
    http-request deny if { path -m sub -i %2f }
    # Bulk and exfiltrating operations inside the allowed groups that the
    # worker never makes: prune (which deletes every unused volume on the
    # host), push, load, get/export, and an image import from a URL.
    http-request deny if { path -m reg '/(prune|push|load|get|export)$' }
    http-request deny if { path -m reg '^(/v[0-9.]+)?/images/create$' } { url_param(fromSrc) -m found }
    http-request deny unless { path -m reg '^(/v[0-9.]+)?/(_ping|version|containers|exec|images|volumes)(/|$)' }
    default_backend dockerd

backend dockerd
    server dockerd /var/run/docker.sock
