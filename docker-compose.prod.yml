# Production overlay — always composed on top of docker-compose.infra.yml:
#   docker compose -f docker-compose.infra.yml -f docker-compose.prod.yml up -d
#
# SECURITY (SEC-4): this overlay refuses to start on the dev-default
# credentials baked into docker-compose.infra.yml. POSTGRES_PASSWORD,
# ARTIFACT_S3_ACCESS_KEY, and ARTIFACT_S3_SECRET_KEY are mandatory here (`:?`); the
# same variables feed the postgres/garage services in the infra file, so setting
# them in `.env` secures the whole stack. Set DATABASE_URL_OVERRIDE to use an
# external Postgres instead (POSTGRES_PASSWORD is then not required by the
# gateway/worker, but still set it if the bundled postgres service runs), and
# see `.env.example` for swapping the object store to a hosted S3 provider.
services:
  # The production dynamic config: development-sql.yaml minus its dev-only
  # setting. Compose merges `environment` by name, so only this entry changes.
  temporal:
    environment:
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/production-sql.yaml

  gateway:
    image: ${APP_IMAGE_GATEWAY:-ghcr.io/yorch/auto-swe/gateway:main}
    pull_policy: always
    init: true
    restart: unless-stopped
    ports:
      - ${GATEWAY_PORT:-8080}:8080
    env_file:
      - .env
    environment:
      # Pinned so a development value in `.env` cannot switch the image onto
      # the in-source dev secrets (`environment:` wins over `env_file`).
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL_OVERRIDE:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in production — set a strong value in .env (or set DATABASE_URL_OVERRIDE for an external database)}@postgres:5432/${POSTGRES_DB:-engineering_system}}
      TEMPORAL_ADDRESS: temporal:7233
      PORT: "8080"
      # The image runs with NODE_ENV=production and refuses the in-source dev
      # fallbacks for these, so surface a missing one as a compose error at
      # `up` time rather than a crash loop after the pull.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required in production — set a strong random value in .env}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required in production — set a random value of at least 32 chars in .env}
      CONFIG_ENCRYPTION_KEY: ${CONFIG_ENCRYPTION_KEY:?CONFIG_ENCRYPTION_KEY is required in production — generate one with openssl rand -base64 32 and set it in .env}
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy

  worker:
    image: ${APP_IMAGE_WORKER:-ghcr.io/yorch/auto-swe/worker:main}
    pull_policy: always
    init: true
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Pinned so a development value in `.env` cannot switch the image onto
      # the in-source dev secrets (`environment:` wins over `env_file`).
      NODE_ENV: production
      # The in-app assistant's tools call the gateway on the compose network.
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://gateway:8080}
      DATABASE_URL: ${DATABASE_URL_OVERRIDE:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in production — set a strong value in .env (or set DATABASE_URL_OVERRIDE for an external database)}@postgres:5432/${POSTGRES_DB:-engineering_system}}
      TEMPORAL_ADDRESS: temporal:7233
      # Same key as the gateway — every provider credential decrypts with it.
      CONFIG_ENCRYPTION_KEY: ${CONFIG_ENCRYPTION_KEY:?CONFIG_ENCRYPTION_KEY is required in production — generate one with openssl rand -base64 32 and set it in .env}
      # Defaults to the bundled Garage service. To use hosted S3 instead
      # (AWS/R2/B2/…), set these three plus the credentials below in `.env` and
      # clear COMPOSE_PROFILES so the bundled store is not started — no compose
      # file needs editing. ARTIFACT_S3_FORCE_PATH_STYLE must stay true for
      # Garage and MinIO-likes; AWS S3 and R2 want it false.
      ARTIFACT_S3_ENDPOINT: ${ARTIFACT_S3_ENDPOINT:-http://garage:3900}
      ARTIFACT_S3_FORCE_PATH_STYLE: ${ARTIFACT_S3_FORCE_PATH_STYLE:-true}
      ARTIFACT_S3_REGION: ${ARTIFACT_S3_REGION:-us-east-1}
      # No dev fallback in production. When the bundled store is in use these
      # same values provision its access key (see docker-compose.infra.yml), so
      # requiring them here guarantees it never runs on the dev placeholder.
      # When a hosted provider is in use they are that provider's credentials.
      # Named ARTIFACT_S3_* on the outside so an ambient AWS_ACCESS_KEY_ID in the
      # deploying shell cannot silently take precedence over `.env`.
      AWS_ACCESS_KEY_ID: ${ARTIFACT_S3_ACCESS_KEY:?ARTIFACT_S3_ACCESS_KEY is required in production — do not use the local dev default}
      AWS_SECRET_ACCESS_KEY: ${ARTIFACT_S3_SECRET_KEY:?ARTIFACT_S3_SECRET_KEY is required in production — do not use the local dev default}
      # The Claude Code harness sends its model calls through a metering proxy
      # in the worker, so a workspace container never holds the provider key.
      # Workspaces join the `workspaces` network, where they reach this worker
      # by its own hostname; nothing is published on the host. Set
      # HARNESS_MODEL_PROXY_PORT empty to turn the proxy off.
      HARNESS_MODEL_PROXY_PORT: ${HARNESS_MODEL_PROXY_PORT-8790}
      HARNESS_MODEL_PROXY_URL: ${HARNESS_MODEL_PROXY_URL:-http://{hostname}:${HARNESS_MODEL_PROXY_PORT:-8790}}
      WORKSPACE_NETWORK: ${WORKSPACE_NETWORK:-auto-swe-workspaces}
      # The Docker CLI the worker shells out to talks to the socket proxy, not a socket.
      DOCKER_HOST: tcp://docker-socket-proxy:2375
    networks:
      - default
      - workspaces
      - docker-proxy
    depends_on:
      docker-socket-proxy:
        condition: service_started
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
      # The gateway syncs the built-in config the worker's boot check requires.
      gateway:
        condition: service_healthy
      # `required: false` so a deployment pointing ARTIFACT_S3_ENDPOINT at a
      # hosted provider can leave the `objectstore` profile off; the worker then
      # starts without it instead of failing on a missing dependency.
      garage:
        condition: service_healthy
        required: false

  # Docker API filter in front of the host socket: haproxy with the allowlist
  # and timeouts in infra/docker-socket-proxy/haproxy.cfg, which says what each
  # allowed path is for. The worker reaches the daemon only through this
  # container (DOCKER_HOST), so it never holds the socket. It limits the API
  # surface, NOT the options of a container the worker is allowed to create:
  # see docs/deployment.md. Root only to open the socket; nothing else runs here.
  docker-socket-proxy:
    image: ${DOCKER_SOCKET_PROXY_IMAGE:-haproxy:3.4-alpine@sha256:7af8255207ee9964ccb4eec8ce4b7a40b777769665e3ae83897fb01b24d8a43a}
    restart: unless-stopped
    user: root
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./infra/docker-socket-proxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - docker-proxy

  web:
    image: ${APP_IMAGE_WEB:-ghcr.io/yorch/auto-swe/web:main}
    pull_policy: always
    init: true
    restart: unless-stopped
    ports:
      - ${WEB_PORT:-3000}:3000
    # No `env_file`: the dashboard reads only the variables below, and handing
    # it `.env` would put every secret (CONFIG_ENCRYPTION_KEY, auth secrets,
    # integration tokens) in a process that needs none of them. Compose still
    # interpolates `${...}` from `.env`, so these are set there as usual.
    environment:
      NODE_ENV: production
      # The gateway as the BROWSER reaches it — a public URL, never the compose
      # hostname, which no browser can resolve.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required in production — set it to the public gateway URL in .env}
      # The gateway as the web container reaches it for server-side fetches.
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://gateway:8080}
      NEXT_PUBLIC_TEMPORAL_UI_URL: ${NEXT_PUBLIC_TEMPORAL_UI_URL:-}
      NEXT_PUBLIC_GRAFANA_URL: ${NEXT_PUBLIC_GRAFANA_URL:-}
      PORT: "3000"
      # Docker sets HOSTNAME to the container id, and the standalone Next server
      # binds to HOSTNAME — so without this it listens on one network's address
      # only, and the image's 127.0.0.1 healthcheck cannot reach it.
      HOSTNAME: 0.0.0.0
    depends_on:
      gateway:
        condition: service_healthy

networks:
  # Agent workspaces and the worker, and nothing else: a workspace reaches the
  # worker's model proxy here, never the database or Temporal.
  workspaces:
    name: ${WORKSPACE_NETWORK:-auto-swe-workspaces}
  # The worker and the socket proxy, and nothing else. `internal` gives it no
  # route out, so the unauthenticated Docker API on :2375 is reachable by
  # exactly these two containers.
  docker-proxy:
    internal: true
