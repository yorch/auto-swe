{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "auto-swe.fullname" . }}
  labels:
    {{- include "auto-swe.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    # The gateway: API, webhooks, OAuth callbacks.
    - host: {{ (urlParse .Values.urls.api).hostname | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "auto-swe.fullname" . }}-gateway
                port:
                  name: http
    - host: {{ (urlParse .Values.urls.web).hostname | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "auto-swe.fullname" . }}-web
                port:
                  name: http
{{- end }}
