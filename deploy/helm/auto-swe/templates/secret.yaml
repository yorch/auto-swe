{{- if not .Values.secrets.existingSecret }}
# Rendered only when no existingSecret is named. It is a pre-install/pre-upgrade
# hook so it exists before the migration Job, which is one too. Helm does not
# delete hook resources on uninstall: remove this Secret yourself (and keep a copy
# of CONFIG_ENCRYPTION_KEY, without which stored credentials cannot be read).
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "auto-swe.secretName" . }}
  labels:
    {{- include "auto-swe.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
type: Opaque
stringData:
  {{- range $key, $value := .Values.secrets.values }}
  {{- if $value }}
  {{ $key }}: {{ $value | toString | quote }}
  {{- end }}
  {{- end }}
  {{- range $key, $value := .Values.secrets.extra }}
  {{ $key }}: {{ $value | toString | quote }}
  {{- end }}
{{- end }}
