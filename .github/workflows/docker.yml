name: Build and Publish Docker Images

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  GHCR_PREFIX: ghcr.io/${{ github.repository }}
  # Target platforms for both the PR build and the publish job.
  #
  # linux/arm64 is TEMPORARILY DISABLED. There are no arm64 runners here, so it
  # builds under QEMU, and the gateway image's
  # `yarn workspaces focus @auto-swe/gateway --production` dies with an illegal
  # instruction (exit 132). web and worker build fine on both arches in the same
  # run, so it is specific to that step rather than to emulation as such.
  #
  # To re-enable, restore the value below:
  #   BUILD_PLATFORMS: linux/amd64,linux/arm64
  # Ideally alongside a native arm64 runner (e.g. a matrix over ubuntu-latest /
  # ubuntu-24.04-arm) so emulation is out of the picture entirely.
  BUILD_PLATFORMS: linux/amd64

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        run: |
          MATRIX=$(echo '{"include":[
            {"component":"gateway","dockerfile":"packages/gateway/Dockerfile"},
            {"component":"web","dockerfile":"packages/web/Dockerfile"},
            {"component":"worker","dockerfile":"packages/worker/Dockerfile"}
          ]}' | tr -d '\n')
          echo "matrix=${MATRIX}" >> "${GITHUB_OUTPUT}"

  # Gate publishing on the same checks CI runs: without this, a commit that
  # fails them still produces :main images, which the Watchtower-based prod
  # stack auto-deploys. It calls ci.yml itself rather than restating its steps,
  # so the publish gate carries every job the PR gate does — docs drift, source
  # invariants, typecheck/lint/test/build, and the real-database migrations job
  # — and cannot fall behind it.
  checks:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # Advisory only — reported, never gating a publish.
  audit:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # See ci.yml for where `yarn` comes from on Node 26 runners.
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.node-version'
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Audit dependencies (advisory)
        run: yarn npm audit --severity high || true

  build:
    needs: setup
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Retained for the arm64 re-enable path — QEMU only does anything when a
      # non-native platform is in `platforms:`, so it is a no-op while the
      # builds are amd64-only.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build ${{ matrix.component }} (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ env.BUILD_PLATFORMS }}
          push: false
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  publish:
    needs: [setup, checks]
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # Retained for the arm64 re-enable path — QEMU only does anything when a
      # non-native platform is in `platforms:`, so it is a no-op while the
      # builds are amd64-only.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to external registry
        if: vars.EXTERNAL_REGISTRY_URL != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ vars.EXTERNAL_REGISTRY_URL }}
          username: ${{ secrets.EXTERNAL_REGISTRY_USERNAME }}
          password: ${{ secrets.EXTERNAL_REGISTRY_PASSWORD }}

      - name: Build image list
        id: images
        env:
          GHCR_PREFIX: ${{ env.GHCR_PREFIX }}
          COMPONENT: ${{ matrix.component }}
          EXTERNAL_REGISTRY_URL: ${{ vars.EXTERNAL_REGISTRY_URL }}
          EXTERNAL_REGISTRY_IMAGE: ${{ vars.EXTERNAL_REGISTRY_IMAGE }}
        run: |
          IMAGES="${GHCR_PREFIX}/${COMPONENT}"
          if [[ -n "${EXTERNAL_REGISTRY_URL}" ]]; then
            BASE="${EXTERNAL_REGISTRY_IMAGE:-${GITHUB_REPOSITORY##*/}}"
            IMAGES="${IMAGES}"$'\n'"${EXTERNAL_REGISTRY_URL}/${BASE}-${COMPONENT}"
          fi
          {
            echo 'list<<EOF'
            echo "${IMAGES}"
            echo 'EOF'
          } >> "${GITHUB_OUTPUT}"

      - name: Get build info
        id: build-info
        run: |
          echo "branch=${GITHUB_REF_NAME}"                                                >> "${GITHUB_OUTPUT}"
          echo "build_number=${{ github.run_number }}"                                    >> "${GITHUB_OUTPUT}"
          echo "commit=$(git rev-parse --short HEAD)"                                     >> "${GITHUB_OUTPUT}"
          echo "tag=${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}" >> "${GITHUB_OUTPUT}"
          echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)"                                      >> "${GITHUB_OUTPUT}"
          echo "timestamp=$(git show -s --date=format:'%Y%m%d%H%M' --format=%cd)"         >> "${GITHUB_OUTPUT}"
          echo "version=$(git describe --tags --always)"                                  >> "${GITHUB_OUTPUT}"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ steps.images.outputs.list }}
          tags: |
            type=raw,value=${{ steps.build-info.outputs.timestamp }}-${{ steps.build-info.outputs.commit }}
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push ${{ matrix.component }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ env.BUILD_PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.build-info.outputs.version }}
            BUILD_NUMBER=${{ steps.build-info.outputs.build_number }}
            BUILD_TIME=${{ steps.build-info.outputs.time }}
            COMMIT_HASH=${{ steps.build-info.outputs.commit }}
            GIT_BRANCH=${{ steps.build-info.outputs.branch }}
            GIT_TAG=${{ steps.build-info.outputs.tag }}
            GIT_TIMESTAMP=${{ steps.build-info.outputs.timestamp }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
