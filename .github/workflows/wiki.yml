name: Wiki freshness

# `wiki/` is a generated, commit-pinned snapshot. It is checked here rather than in
# ci.yml because staleness is a property of time, not of a change. Pull requests run
# the integrity checks only (WIKI_SKIP_STALENESS), so an unrelated change to this
# workflow, such as an action bump, never fails on the snapshot's age; the weekly
# schedule and manual dispatch run integrity plus staleness.
on:
  schedule:
    - cron: '0 6 * * 1' # Mondays, 06:00 UTC
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'wiki/**'
      - 'scripts/check-wiki.mjs'
      - '.github/workflows/wiki.yml'

concurrency:
  group: wiki-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  wiki:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Full history: the check counts commits since the pinned one.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.node-version'

      # Invoked directly, not via `yarn wiki:check`: no dependencies, so no install.
      - name: Check wiki freshness
        env:
          WIKI_SKIP_STALENESS: ${{ github.event_name == 'pull_request' && '1' || '' }}
        run: node scripts/check-wiki.mjs
