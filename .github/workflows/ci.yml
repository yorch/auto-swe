name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # docker.yml calls this whole workflow as its publish gate, so the checks an
  # image must pass are defined once and cannot drift from the PR gate.
  workflow_call:

# When called from docker.yml, `github.workflow` is the caller's name, so its
# runs get their own group. Only pull-request runs cancel a superseded run: a
# main push must finish its checks, or docker.yml never publishes that commit.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://ci:ci@invalid.local:5432/ci

jobs:
  # Living docs make countable claims ("15 node types", "51 Prisma models"). Prose has
  # no compiler, so this is one: it derives each fact from source and fails on any doc
  # that disagrees, and separately rejects broken relative doc links. No dependencies,
  # so it runs standalone and reports in seconds.
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.node-version'

      # Invoked directly rather than via `yarn docs:check`: Yarn 4 refuses to run a
      # script before `yarn install`, and this check deliberately needs no install.
      - name: Check documentation drift
        run: node scripts/check-doc-drift.mjs

      # Same shape and the same reason: rules the type checker cannot state and
      # the test suite does not execute, each one added after it shipped past a
      # green suite. No dependencies, so it runs here rather than behind install.
      - name: Check source invariants
        run: node scripts/check-invariants.mjs

  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Where `yarn` comes from here changed with Node 26, and it is no longer
      # something this repo pins. setup-node extracts the plain Node
      # distribution and provides no Corepack and no yarn shim of its own; Node
      # 26 dropped Corepack, so the `yarn` that runs is the Yarn Classic
      # preinstalled on the GitHub runner image. It reads .yarnrc.yml's
      # `yarnPath` and execs the vendored .yarn/releases/yarn-4.18.0.cjs, so
      # every yarn call below is really Yarn 4 (`yarn --version` -> 4.18.0).
      #
      # Two consequences. `cache: yarn` probes `yarn --version` INSIDE this
      # step, before any later step could install a package manager — so a fix
      # for a missing yarn would have to go before setup-node, not after. And a
      # self-hosted runner without Yarn Classic on PATH needs one, e.g. a shim
      # execing the vendored release.
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.node-version'
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Generate Prisma client
        run: yarn db:generate

      - name: Type check
        run: yarn typecheck

      - name: Lint
        run: yarn lint

      - name: Test (with coverage report)
        run: yarn test --coverage

      - name: Build
        run: yarn build

  # Real-container job: the suites that drive a real Docker daemon. The
  # unit-test job skips them (`describe.skipIf(!enabled)`), and the code they
  # cover — the Claude Code harness through `docker exec`, its worker-side tool
  # policy and native binary, and the trusted agent-run finalize shell — is
  # mocked everywhere else. GitHub-hosted Ubuntu runners have a Docker daemon;
  # the suites pull public Alpine images and `apk add` inside them, and the
  # harness talks to a local mock Messages API, so no secret is needed.
  docker-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.node-version'
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Generate Prisma client
        run: yarn db:generate

      # The real runtime against a real container and a mock model API: the SDK,
      # `docker exec`, the musl binary from node_modules and the policy hook together.
      - name: Claude Code harness (Docker-backed tests)
        env:
          CLAUDE_CODE_DOCKER_TEST: '1'
        run: yarn test packages/worker/src/agents/claudeCode/runtime.docker.test.ts

      # The trusted finalize path's real shell against a deliberately hostile
      # agent container (a lying `git`, `* -diff`, a planted symlink, a secret).
      - name: Agent-run finalize (Docker-backed tests)
        env:
          AGENT_RUN_DOCKER_TEST: '1'
        run: yarn test packages/worker/src/activities/agentRunFinalize.docker.test.ts

  # Real-database job: applies every migration to a fresh Postgres+pgvector
  # and runs the seed. The unit-test job deliberately uses an unreachable
  # DATABASE_URL (all Prisma access is mocked), so without this nothing in CI
  # ever validated the migrations or the seed against an actual schema.
  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      SEED_ADMIN_PASSWORD: ci-only-not-a-real-deployment
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.node-version'
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Generate Prisma client
        run: yarn db:generate

      # `db:deploy` is `prisma migrate deploy` — the production path. The dev
      # command (`prisma migrate dev`) diffs the schema against the migrations
      # and tries to *generate* one when they disagree, which here would mean
      # dropping the hand-written HNSW index rather than reporting drift.
      - name: Apply all migrations to a fresh database
        run: yarn db:deploy

      # Diffs the database the migrations just built against schema.prisma, so a
      # schema edit without a migration (or a migration the schema does not
      # describe) fails here rather than at the next deploy. `migrate status`
      # cannot do this: it compares the migrations table with the migrations
      # directory and never reads the schema.
      #
      # The diff is never empty. DDL Prisma's DSL cannot express lives in the
      # hand-written migrations, and the diff reads it as drift and proposes
      # dropping it (.claude/skills/prisma-pgvector-hnsw). Those statements are
      # listed exactly in EXPECTED; any other statement fails the step. A new
      # hand-written index Prisma cannot express belongs in that list too.
      - name: Verify migrations match schema.prisma
        working-directory: packages/shared
        run: |
          set -euo pipefail
          EXPECTED='DROP INDEX "idx_memory_items_embedding";'
          diff_sql=$(yarn prisma migrate diff \
            --from-config-datasource \
            --to-schema src/prisma/schema.prisma \
            --script)
          unexpected=$(printf '%s\n' "$diff_sql" \
            | grep -Ev '^[[:space:]]*(--.*)?$' \
            | grep -vxF -e "$EXPECTED" || true)
          if [ -n "$unexpected" ]; then
            echo "::error::schema.prisma and the committed migrations disagree. Add a migration (see .claude/skills/prisma-pgvector-hnsw). Unexpected diff:"
            printf '%s\n' "$unexpected"
            exit 1
          fi
          echo "Migrations match schema.prisma (only the known hand-written DDL differs)."

      # The full seed: the shared half (admin user, default team, sample repo,
      # templates, skills, agents) and the gateway half (provisionAuthAdmin,
      # which gives the seeded admin a better-auth credential account).
      - name: Seed
        env:
          BETTER_AUTH_SECRET: ci-only-not-a-real-deployment-secret-32chars
          JWT_SECRET: ci-only-not-a-real-deployment-secret
        run: |
          export CONFIG_ENCRYPTION_KEY=$(openssl rand -base64 32)
          yarn db:seed

      - name: Re-apply migrations (idempotency check)
        run: yarn db:deploy

      # The OAuth authorization server for MCP clients, end to end against the
      # schema the migrations just built: the real better-auth provider through
      # the Prisma adapter. The unit-test job cannot run it (no database), and
      # the memory adapter hides what it covers: the NULL-versus-empty array
      # columns, the boot-time resource seed, and the urlencoded body bridge the
      # token endpoint depends on. Opt-in because it writes and deletes rows.
      - name: OAuth authorization server (database-backed tests)
        env:
          MCP_OAUTH_PG_TEST: '1'
        run: yarn test packages/gateway/src/lib/mcpOAuthServer.pg.test.ts

      # Consent, the login hand-off and durable revocation, against the same
      # schema. A separate step, not a second file in the one above: both suites
      # clear the OAuth tables, so they must not run side by side.
      - name: MCP grants and revocation (database-backed tests)
        env:
          MCP_OAUTH_PG_TEST: '1'
        run: yarn test packages/gateway/src/lib/mcpGrants.pg.test.ts

      # The MCP resource server, against tokens that server issued: its consent,
      # client and user checks and its read of the signing keys. A separate step
      # because both suites wipe the same OAuth tables and settings, so they must
      # not run side by side.
      - name: MCP endpoint (database-backed tests)
        env:
          MCP_OAUTH_PG_TEST: '1'
        run: yarn test packages/gateway/src/routes/mcp.pg.test.ts

      # `Idempotency-Key` on POST /work-requests: the unique index and the lost-race
      # path are the mechanism, so this needs the real schema, not a mocked Prisma.
      - name: Work-request idempotency (database-backed tests)
        env:
          WORK_REQUEST_PG_TEST: '1'
        run: yarn test packages/gateway/src/routes/workRequests.idempotency.pg.test.ts

      # The pull-request and ticket views: what a list leaves out is decided by
      # relational visibility filters over a group that spans two teams, which a
      # mocked Prisma would not evaluate.
      - name: Pull-request and ticket views (database-backed tests)
        env:
          WORK_VIEWS_PG_TEST: '1'
        run: yarn test packages/gateway/src/routes/workViews.pg.test.ts

      # The read tools against the real route plugins and the same tables: what a
      # tool returns for a team member, an outsider, an ADMIN and a deactivated
      # user is what REST returns for them. Its own step, for the same reason: it
      # wipes the OAuth tables the suites above also use.
      - name: MCP read tools (database-backed tests)
        env:
          MCP_OAUTH_PG_TEST: '1'
        run: yarn test packages/gateway/src/lib/mcp/tools.pg.test.ts

      # The write tools: the concurrency cap is a count taken under a per-user
      # advisory lock inside the transaction that writes the ledger rows, which
      # only parallel requests against a real database can exercise. Its own
      # step, as it wipes the same OAuth tables and settings as the suites above.
      - name: MCP write tools (database-backed tests)
        env:
          MCP_OAUTH_PG_TEST: '1'
        run: yarn test packages/gateway/src/lib/mcp/writeTools.pg.test.ts

      # Model-discovery suggestions: the upserts are keyed on the
      # (provider, model_id) unique index, and a refresh racing another must
      # neither duplicate a row nor lose a dismissal.
      - name: Model suggestions (database-backed tests)
        env:
          MODEL_SUGGESTIONS_PG_TEST: '1'
        run: yarn test packages/shared/src/lib/modelSuggestions.pg.test.ts

      # Skill revisions: the revision-guarded update is what makes two racing
      # edits resolve to one winner, and `(skill_id, revision)` is unique.
      - name: Skill revisions (database-backed tests)
        env:
          SKILL_REVISION_PG_TEST: '1'
        run: yarn test packages/gateway/src/lib/skillRevision.pg.test.ts

      # Skill sources: the per-scope partial unique indexes, the one-transaction
      # install, and the foreign key that detaches a deleted source's skills.
      - name: Skill sources (database-backed tests)
        env:
          SKILL_SOURCE_PG_TEST: '1'
        run: yarn test packages/gateway/src/lib/skillSource.pg.test.ts packages/gateway/src/lib/skillSourceBudget.pg.test.ts

      # Password sign-in for an admin-created user, through the real better-auth
      # handler: it looks an account up by the lower-cased email, so a route that
      # stores the address as typed makes an account nobody can sign in to.
      - name: Admin-created user sign-in (database-backed tests)
        env:
          USER_SIGNIN_PG_TEST: '1'
        run: yarn test packages/gateway/src/routes/users.signin.pg.test.ts
