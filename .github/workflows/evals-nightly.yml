# Nightly eval regression gate (docs/evals-p1.md WS5).
#
# Runs the frozen-benchmark harness for the implementer against `main` vs the
# last release and fails on a *significant* regression (the CLI exits non-zero
# when the paired 95% CI of the delta excludes 0 in the worse direction).
#
# Nightly, NOT per-PR: a candidate run is a multi-minute Docker + LLM job per
# case, so a full benchmark is hours and dollars (RFC §4.3). Requires repository
# secrets AUTO_SWE_API_URL + AUTO_SWE_TOKEN (an admin PAT) pointing at a gateway
# that can reach Docker + the model provider.
name: evals-nightly

on:
  schedule:
    - cron: '0 7 * * *' # 07:00 UTC daily
  workflow_dispatch:
    inputs:
      dataset:
        description: Eval dataset slug
        default: swe-implementer-golden
      against:
        description: Baseline ref to compare main against
        default: last-release

jobs:
  regression-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable corepack
        run: corepack enable
      - name: Install
        run: yarn install --immutable
      - name: Build CLI
        run: yarn workspace @auto-swe/cli run build
      - name: Run eval regression gate
        env:
          AUTO_SWE_API_URL: ${{ secrets.AUTO_SWE_API_URL }}
          AUTO_SWE_TOKEN: ${{ secrets.AUTO_SWE_TOKEN }}
        run: |
          node packages/cli/dist/index.js evals run \
            "${{ github.event.inputs.dataset || 'swe-implementer-golden' }}" \
            --candidate=main \
            --against="${{ github.event.inputs.against || 'last-release' }}"
