name: Build Executor Image

on:
  workflow_dispatch:
    inputs:
      repo_id:
        description: 'Repository UUID from the database'
        required: true
      use_repo_dockerfile:
        description: "Build the repository's own .auto-swe/Dockerfile instead of the platform default"
        type: boolean
        default: false
      stack:
        description: 'Curated defaults/Dockerfile.<stack> to build (ignored when use_repo_dockerfile)'
        type: choice
        options: [node, python, jvm]
        default: node
  # client_payload: { repo_id, use_repo_dockerfile?, stack? } — stack defaults to node.
  repository_dispatch:
    types: [build-executor]
  # No schedule: a scheduled run carries no repo_id, and fanning a schedule out
  # over every repository needs a caller that lists them. A trigger without an
  # id fails rather than passing as a no-op.

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read # actions/checkout and the default-Dockerfile fetch
      id-token: write # For OIDC -> ECR auth

    steps:
      # Inputs are passed through `env:` rather than interpolated into the
      # script body, so a crafted repo_id (or client_payload) cannot inject
      # shell — `${{ }}` expands before bash parses the line.
      - name: Determine repo ID
        id: repo
        env:
          INPUT_REPO_ID: ${{ github.event.inputs.repo_id }}
          PAYLOAD_REPO_ID: ${{ github.event.client_payload.repo_id }}
        run: |
          if [ -n "${INPUT_REPO_ID}" ]; then
            echo "id=${INPUT_REPO_ID}" >> "$GITHUB_OUTPUT"
          elif [ -n "${PAYLOAD_REPO_ID}" ]; then
            echo "id=${PAYLOAD_REPO_ID}" >> "$GITHUB_OUTPUT"
          else
            echo "::error::No repo_id provided (workflow_dispatch input or client_payload.repo_id)"
            exit 1
          fi

      - name: Fetch repo config from Gateway API
        id: config
        env:
          GATEWAY_TOKEN: ${{ secrets.GATEWAY_TOKEN }}
          GATEWAY_URL: ${{ secrets.GATEWAY_URL }}
          REPO_ID: ${{ steps.repo.outputs.id }}
        # The gateway has no single-repository GET, so page through the list
        # endpoint (which returns only what the token's user may reach) and pick
        # the row by id. includeInactive lets the token rebuild a paused repo. The token must be
        # a platform admin's: only an admin may set a connection's executor image.
        run: |
          set -euo pipefail
          LIMIT=500
          OFFSET=0
          REPO=''
          while :; do
            PAGE=$(curl -sf -H "Authorization: Bearer ${GATEWAY_TOKEN}" \
              "${GATEWAY_URL}/api/v1/repositories?includeInactive=true&limit=${LIMIT}&offset=${OFFSET}")
            REPO=$(echo "$PAGE" | jq -c --arg id "$REPO_ID" '.data[] | select(.id == $id)')
            TOTAL=$(echo "$PAGE" | jq -r '.meta.total // 0')
            OFFSET=$((OFFSET + LIMIT))
            if [ -n "$REPO" ] || [ "$OFFSET" -ge "$TOTAL" ]; then break; fi
          done
          if [ -z "$REPO" ]; then
            echo "::error::Repository ${REPO_ID} not found or not visible to GATEWAY_TOKEN"
            exit 1
          fi
          echo "org=$(echo "$REPO" | jq -r '.organizationName')" >> "$GITHUB_OUTPUT"
          echo "name=$(echo "$REPO" | jq -r '.repoName')" >> "$GITHUB_OUTPUT"

      - name: Checkout target repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ steps.config.outputs.org }}/${{ steps.config.outputs.name }}
          token: ${{ secrets.GITHUB_APP_TOKEN }}
          # Only read and built here, never pushed to, so the token is not left
          # in .git/config where the build context (and the Dockerfile) sees it.
          persist-credentials: false

      # The image receives the run's GitHub credential, so by default it is built
      # only from the platform's own defaults/Dockerfile.node: anyone who can merge
      # to the target repository must not choose the code that runs next to that
      # credential. The repository's own .auto-swe/Dockerfile is used only when this
      # run opts in (use_repo_dockerfile). The default Dockerfile is written outside
      # the checkout so a file in the repository cannot shadow it.
      - name: Resolve Dockerfile
        id: dockerfile
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONTROL_PLANE_REPO: ${{ github.repository }}
          INPUT_USE_REPO_DOCKERFILE: ${{ github.event.inputs.use_repo_dockerfile }}
          PAYLOAD_USE_REPO_DOCKERFILE: ${{ github.event.client_payload.use_repo_dockerfile }}
          INPUT_STACK: ${{ github.event.inputs.stack }}
          PAYLOAD_STACK: ${{ github.event.client_payload.stack }}
          RUNNER_TEMP_DIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          if [ "${INPUT_USE_REPO_DOCKERFILE}" = "true" ] || [ "${PAYLOAD_USE_REPO_DOCKERFILE}" = "true" ]; then
            if [ ! -f ".auto-swe/Dockerfile" ]; then
              echo "::error::use_repo_dockerfile was requested but the repository has no .auto-swe/Dockerfile"
              exit 1
            fi
            echo "::warning::Building the repository's own .auto-swe/Dockerfile (use_repo_dockerfile)"
            echo "path=.auto-swe/Dockerfile" >> "$GITHUB_OUTPUT"
            echo "context=." >> "$GITHUB_OUTPUT"
          else
            STACK="${INPUT_STACK:-${PAYLOAD_STACK:-node}}"
            case "${STACK}" in
              node|python|jvm) ;;
              *)
                echo "::error::Unknown stack '${STACK}' (expected node, python or jvm)"
                exit 1
                ;;
            esac
            if [ -f ".auto-swe/Dockerfile" ]; then
              echo "::warning::The repository has .auto-swe/Dockerfile but use_repo_dockerfile is not set; building defaults/Dockerfile.${STACK}"
            fi
            # Fetch the curated executor Dockerfile for the stack from the control-plane repo
            curl -sf -H "Authorization: Bearer ${GH_TOKEN}" \
              "https://raw.githubusercontent.com/${CONTROL_PLANE_REPO}/main/defaults/Dockerfile.${STACK}" \
              -o "${RUNNER_TEMP_DIR}/Dockerfile.${STACK}"
            echo "path=${RUNNER_TEMP_DIR}/Dockerfile.${STACK}" >> "$GITHUB_OUTPUT"
            # An empty build context: nothing from the repository can reach the
            # default image, whatever Dockerfile.node later copies.
            mkdir -p "${RUNNER_TEMP_DIR}/empty-context"
            echo "context=${RUNNER_TEMP_DIR}/empty-context" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ secrets.ECR_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2
        id: ecr-login

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Generate image metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: meta
        with:
          images: ${{ steps.ecr-login.outputs.registry }}/auto-swe/executors/${{ steps.config.outputs.org }}-${{ steps.config.outputs.name }}
          tags: |
            type=raw,value={{date 'YYYYMMDD'}}-{{sha}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ steps.dockerfile.outputs.context }}
          file: ${{ steps.dockerfile.outputs.path }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Scoped per repository: the default shared scope lets each repo's
          # build evict and overwrite the others' cache.
          cache-from: type=gha,scope=executor-${{ steps.repo.outputs.id }}
          cache-to: type=gha,mode=max,scope=executor-${{ steps.repo.outputs.id }}

      - name: Update repository executor image in Gateway
        env:
          GATEWAY_TOKEN: ${{ secrets.GATEWAY_TOKEN }}
          GATEWAY_URL: ${{ secrets.GATEWAY_URL }}
          REPO_ID: ${{ steps.repo.outputs.id }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          # Use the first tag (date-sha) as the pinned image reference
          IMAGE_TAG=$(echo "${IMAGE_TAGS}" | head -1)
          curl -sf -X PATCH \
            -H "Authorization: Bearer ${GATEWAY_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$(jq -cn --arg image "${IMAGE_TAG}" '{executorImage: $image}')" \
            "${GATEWAY_URL}/api/v1/repositories/${REPO_ID}"
