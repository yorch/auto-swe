name: Build Executor Image

on:
  workflow_dispatch:
    inputs:
      repo_id:
        description: 'Repository UUID from the database'
        required: true
  repository_dispatch:
    types: [build-executor]
  # No schedule: a scheduled run carries no repo_id, and fanning a schedule out
  # over every repository needs a caller that lists them. A trigger without an
  # id fails rather than passing as a no-op.

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read # actions/checkout and the default-Dockerfile fetch
      id-token: write # For OIDC -> ECR auth

    steps:
      # Inputs are passed through `env:` rather than interpolated into the
      # script body, so a crafted repo_id (or client_payload) cannot inject
      # shell — `${{ }}` expands before bash parses the line.
      - name: Determine repo ID
        id: repo
        env:
          INPUT_REPO_ID: ${{ github.event.inputs.repo_id }}
          PAYLOAD_REPO_ID: ${{ github.event.client_payload.repo_id }}
        run: |
          if [ -n "${INPUT_REPO_ID}" ]; then
            echo "id=${INPUT_REPO_ID}" >> "$GITHUB_OUTPUT"
          elif [ -n "${PAYLOAD_REPO_ID}" ]; then
            echo "id=${PAYLOAD_REPO_ID}" >> "$GITHUB_OUTPUT"
          else
            echo "::error::No repo_id provided (workflow_dispatch input or client_payload.repo_id)"
            exit 1
          fi

      - name: Fetch repo config from Gateway API
        id: config
        env:
          GATEWAY_TOKEN: ${{ secrets.GATEWAY_TOKEN }}
          GATEWAY_URL: ${{ secrets.GATEWAY_URL }}
          REPO_ID: ${{ steps.repo.outputs.id }}
        # The gateway has no single-repository GET, so page through the list
        # endpoint (which returns only what the token's user may reach) and pick
        # the row by id. includeInactive lets the token rebuild a paused repo. The token must be
        # a platform admin's: only an admin may set a connection's executor image.
        run: |
          set -euo pipefail
          LIMIT=500
          OFFSET=0
          REPO=''
          while :; do
            PAGE=$(curl -sf -H "Authorization: Bearer ${GATEWAY_TOKEN}" \
              "${GATEWAY_URL}/api/v1/repositories?includeInactive=true&limit=${LIMIT}&offset=${OFFSET}")
            REPO=$(echo "$PAGE" | jq -c --arg id "$REPO_ID" '.data[] | select(.id == $id)')
            TOTAL=$(echo "$PAGE" | jq -r '.meta.total // 0')
            OFFSET=$((OFFSET + LIMIT))
            if [ -n "$REPO" ] || [ "$OFFSET" -ge "$TOTAL" ]; then break; fi
          done
          if [ -z "$REPO" ]; then
            echo "::error::Repository ${REPO_ID} not found or not visible to GATEWAY_TOKEN"
            exit 1
          fi
          echo "org=$(echo "$REPO" | jq -r '.organizationName')" >> "$GITHUB_OUTPUT"
          echo "name=$(echo "$REPO" | jq -r '.repoName')" >> "$GITHUB_OUTPUT"

      - name: Checkout target repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ steps.config.outputs.org }}/${{ steps.config.outputs.name }}
          token: ${{ secrets.GITHUB_APP_TOKEN }}
          # Only read and built here, never pushed to, so the token is not left
          # in .git/config where the build context (and the Dockerfile) sees it.
          persist-credentials: false

      - name: Resolve Dockerfile
        id: dockerfile
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONTROL_PLANE_REPO: ${{ github.repository }}
        run: |
          if [ -f ".auto-swe/Dockerfile" ]; then
            echo "path=.auto-swe/Dockerfile" >> "$GITHUB_OUTPUT"
          else
            # Fetch default executor Dockerfile from the control-plane repo
            mkdir -p .auto-swe
            curl -sf -H "Authorization: Bearer ${GH_TOKEN}" \
              "https://raw.githubusercontent.com/${CONTROL_PLANE_REPO}/main/defaults/Dockerfile.node" \
              -o .auto-swe/Dockerfile
            echo "path=.auto-swe/Dockerfile" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ secrets.ECR_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2
        id: ecr-login

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Generate image metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: meta
        with:
          images: ${{ steps.ecr-login.outputs.registry }}/auto-swe/executors/${{ steps.config.outputs.org }}-${{ steps.config.outputs.name }}
          tags: |
            type=raw,value={{date 'YYYYMMDD'}}-{{sha}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ${{ steps.dockerfile.outputs.path }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Scoped per repository: the default shared scope lets each repo's
          # build evict and overwrite the others' cache.
          cache-from: type=gha,scope=executor-${{ steps.repo.outputs.id }}
          cache-to: type=gha,mode=max,scope=executor-${{ steps.repo.outputs.id }}

      - name: Update repository executor image in Gateway
        env:
          GATEWAY_TOKEN: ${{ secrets.GATEWAY_TOKEN }}
          GATEWAY_URL: ${{ secrets.GATEWAY_URL }}
          REPO_ID: ${{ steps.repo.outputs.id }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          # Use the first tag (date-sha) as the pinned image reference
          IMAGE_TAG=$(echo "${IMAGE_TAGS}" | head -1)
          curl -sf -X PATCH \
            -H "Authorization: Bearer ${GATEWAY_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$(jq -cn --arg image "${IMAGE_TAG}" '{executorImage: $image}')" \
            "${GATEWAY_URL}/api/v1/repositories/${REPO_ID}"
