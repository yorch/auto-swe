name: Build Executor Image

on:
  workflow_dispatch:
    inputs:
      repo_id:
        description: 'Repository UUID from the database'
        required: true
  repository_dispatch:
    types: [build-executor]
  schedule:
    # Weekly rebuild: Sunday 02:00 UTC
    - cron: '0 2 * * 0'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # For OIDC -> ECR auth

    steps:
      - name: Determine repo ID
        id: repo
        run: |
          if [ -n "${{ github.event.inputs.repo_id }}" ]; then
            echo "id=${{ github.event.inputs.repo_id }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.client_payload.repo_id }}" ]; then
            echo "id=${{ github.event.client_payload.repo_id }}" >> "$GITHUB_OUTPUT"
          else
            echo "No repo_id provided. Scheduled builds should iterate all repos."
            exit 0
          fi

      - name: Fetch repo config from Gateway API
        id: config
        run: |
          REPO=$(curl -sf -H "Authorization: Bearer ${{ secrets.GATEWAY_TOKEN }}" \
            "${{ secrets.GATEWAY_URL }}/api/v1/repositories/${{ steps.repo.outputs.id }}")
          echo "org=$(echo "$REPO" | jq -r '.data.organizationName')" >> "$GITHUB_OUTPUT"
          echo "name=$(echo "$REPO" | jq -r '.data.repoName')" >> "$GITHUB_OUTPUT"

      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.config.outputs.org }}/${{ steps.config.outputs.name }}
          token: ${{ secrets.GITHUB_APP_TOKEN }}

      - name: Resolve Dockerfile
        id: dockerfile
        run: |
          if [ -f ".auto-swe/Dockerfile" ]; then
            echo "path=.auto-swe/Dockerfile" >> "$GITHUB_OUTPUT"
          else
            # Fetch default executor Dockerfile from the control-plane repo
            mkdir -p .auto-swe
            curl -sf -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://raw.githubusercontent.com/${{ github.repository }}/main/defaults/Dockerfile.node24" \
              -o .auto-swe/Dockerfile
            echo "path=.auto-swe/Dockerfile" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.ECR_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
        id: ecr-login

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate image metadata
        uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.ecr-login.outputs.registry }}/auto-swe/executors/${{ steps.config.outputs.org }}-${{ steps.config.outputs.name }}
          tags: |
            type=raw,value={{date 'YYYYMMDD'}}-{{sha}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ steps.dockerfile.outputs.path }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update repository executor image in Gateway
        run: |
          # Use the first tag (date-sha) as the pinned image reference
          IMAGE_TAG=$(echo "${{ steps.meta.outputs.tags }}" | head -1)
          curl -sf -X PATCH \
            -H "Authorization: Bearer ${{ secrets.GATEWAY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"executorImage\": \"${IMAGE_TAG}\"}" \
            "${{ secrets.GATEWAY_URL }}/api/v1/repositories/${{ steps.repo.outputs.id }}"
