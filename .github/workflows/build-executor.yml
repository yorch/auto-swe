name: Build Executor Image

on:
  workflow_dispatch:
    inputs:
      repo_id:
        description: 'Repository UUID from the database'
        required: true
  repository_dispatch:
    types: [build-executor]
  schedule:
    # Weekly rebuild: Sunday 02:00 UTC
    - cron: '0 2 * * 0'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # For OIDC -> ECR auth

    steps:
      - name: Determine repo ID
        id: repo
        run: |
          if [ -n "${{ github.event.inputs.repo_id }}" ]; then
            echo "REPO_ID=${{ github.event.inputs.repo_id }}" >> $GITHUB_ENV
          elif [ -n "${{ github.event.client_payload.repo_id }}" ]; then
            echo "REPO_ID=${{ github.event.client_payload.repo_id }}" >> $GITHUB_ENV
          else
            echo "No repo_id provided. Scheduled builds should iterate all repos."
            exit 0
          fi

      - name: Fetch repo config from Gateway API
        run: |
          REPO=$(curl -sf -H "Authorization: Bearer ${{ secrets.GATEWAY_TOKEN }}" \
            "${{ secrets.GATEWAY_URL }}/api/v1/repositories/${REPO_ID}")
          echo "ORG=$(echo $REPO | jq -r '.data.organizationName')" >> $GITHUB_ENV
          echo "REPO_NAME=$(echo $REPO | jq -r '.data.repoName')" >> $GITHUB_ENV
          echo "EXECUTOR_IMAGE=$(echo $REPO | jq -r '.data.executorImage // \"node:24-alpine\"')" >> $GITHUB_ENV

      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ORG }}/${{ env.REPO_NAME }}
          token: ${{ secrets.GITHUB_APP_TOKEN }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.ECR_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push executor image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          DOCKERFILE=".auto-swe/Dockerfile"
          if [ ! -f "$DOCKERFILE" ]; then
            # Use default executor Dockerfile from control plane
            DOCKERFILE="defaults/Dockerfile.node24"
            # Fetch default from control plane repo
            curl -sf -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://raw.githubusercontent.com/${{ github.repository }}/main/defaults/Dockerfile.node24" \
              -o "$DOCKERFILE" || true
          fi

          IMAGE_TAG="${ORG}-${REPO_NAME}:$(date +%Y%m%d)-${GITHUB_SHA::8}"
          FULL_IMAGE="${ECR_REGISTRY}/auto-swe/executors/${IMAGE_TAG}"

          docker build -f "$DOCKERFILE" -t "$FULL_IMAGE" .
          docker push "$FULL_IMAGE"

          echo "IMAGE_TAG=${FULL_IMAGE}" >> $GITHUB_ENV

      - name: Update repository executor image
        run: |
          curl -sf -X PATCH \
            -H "Authorization: Bearer ${{ secrets.GATEWAY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"executorImage\": \"${IMAGE_TAG}\"}" \
            "${{ secrets.GATEWAY_URL }}/api/v1/repositories/${REPO_ID}"
