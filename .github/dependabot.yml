version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Base images in the three app Dockerfiles (node:26-alpine, plus the worker's
  # docker CLI stage), the agent executor image (defaults/Dockerfile.node) and the pinned
  # infra images in the compose files (pgvector, postgres, temporal, garage,
  # otel-lgtm, watchtower). Compose tags are `${VAR:-default}` expressions;
  # Dependabot updates the default. References written `tag@sha256:<digest>`
  # get the tag and the digest bumped together.
  - package-ecosystem: docker
    directories:
      - /packages/gateway
      - /packages/web
      - /packages/worker
      - /defaults
    schedule:
      interval: weekly
    ignore:
      # The JVM executor image tracks an LTS release (21, 25, ...). A major bump would land on a
      # non-LTS JDK that stops receiving fixes within months and breaks older Gradle wrappers.
      - dependency-name: eclipse-temurin
        update-types: ['version-update:semver-major']
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
