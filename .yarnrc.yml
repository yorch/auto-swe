approvedGitRepositories:
  - "**"

enableScripts: true

enableTelemetry: false

logFilters:
  - code: YN0060
    level: discard
  - code: YN0086
    level: discard

nodeLinker: node-modules

npmMinimalAgeGate: 3

# The worker copies a Claude Code binary into workspace containers, and a
# container's libc is the executor image's, not the worker's: the default
# node:*-alpine image is musl, a Debian one is glibc. Install both libc variants
# of every native optional dependency (for the build architecture, plus linux
# so a macOS dev machine still gets what its Linux containers need).
supportedArchitectures:
  os:
    - current
    - linux
  cpu:
    - current
  libc:
    - glibc
    - musl

yarnPath: .yarn/releases/yarn-4.18.0.cjs
