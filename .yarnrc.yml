approvedGitRepositories:
  - "**"

enableScripts: true

enableTelemetry: false
# Suppress the YN0060 warning that fires because Mastra's internal AI SDK
# v5 shim (aliased as @ai-sdk/ui-utils-v5 → @ai-sdk/ui-utils@1.2.11) declares
# `zod: ^3.23.8` as a peer. Mastra ships its own bundled zod v3 alongside
# the v6 path (zod v4) — runtime is fine. The associated YN0086 "see
# explain" hint adds no signal once YN0060 is suppressed.
logFilters:
  - code: YN0060
    level: discard
  - code: YN0086
    level: discard

nodeLinker: node-modules

npmMinimalAgeGate: 3

yarnPath: .yarn/releases/yarn-4.16.0.cjs
