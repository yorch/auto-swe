# Application stack — NOT runnable standalone.
# Services here reference infra (postgres, temporal) defined in docker-compose.infra.yml.
# Always overlay both files: `docker compose -f docker-compose.app.yml -f docker-compose.infra.yml ...`
# Use the `yarn docker:app:up` / `docker:app:down` / `docker:app:logs` / `docker:app:build` scripts for the
# full stack, or `yarn docker:infra:up` for infra only.
#
# SECURITY (SEC-4): this file is the LOCAL DEV overlay (builds images from
# source) and intentionally keeps the dev-default credential fallbacks
# (POSTGRES_PASSWORD=password, ARTIFACT_S3_ACCESS_KEY/_SECRET_KEY=autoswelocal…) so
# `yarn docker:app:up` works out of the box. The production path is
# docker-compose.prod.yml, which makes those variables mandatory via `:?`.
#
# `.env` reaches the app containers through `env_file`, so every integration
# fallback it sets (GITHUB_*, GOOGLE_*/OKTA_*, SLACK_*, TRACKER_*/KB_*,
# FIGMA_API_TOKEN, SMTP_*/RESEND_*, BUNDLE_*, CI_WAIT_*/CI_POLL_*, …) is visible
# to them without a line here per variable. `environment:` wins over
# `env_file`, so the entries below override the host-oriented values `.env`
# carries for `yarn dev:*` (DATABASE_URL and TEMPORAL_ADDRESS point at
# localhost there) and pin NODE_ENV so a development value in `.env` cannot
# switch the images onto the in-source dev secrets.
#
# Grafana and the OTLP receivers bind to loopback by default, like the infra
# ports; see `.env.example` for the override variables.
services:
  gateway:
    build:
      context: .
      dockerfile: packages/gateway/Dockerfile
    init: true
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-engineering_system}
      - TEMPORAL_ADDRESS=temporal:7233
      # No insecure fallbacks: the gateway image runs with NODE_ENV=production
      # and refuses the in-source dev secrets, so require real values here.
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required — set a strong random value in .env}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required — set a random value of at least 32 chars in .env}
      # Every DB-stored secret (provider keys, GitHub/Slack/S3/OAuth config) is
      # encrypted with this key; the gateway refuses to boot without it.
      - CONFIG_ENCRYPTION_KEY=${CONFIG_ENCRYPTION_KEY:?CONFIG_ENCRYPTION_KEY is required — generate one with openssl rand -base64 32 and set it in .env}
      # Browser-facing URLs. Defaults match the published host ports; override
      # when the dashboard or gateway is reached through another origin.
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:${WEB_PORT:-3000}}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-http://localhost:${GATEWAY_PORT:-8080}}
      - PUBLIC_URL=${PUBLIC_URL:-http://localhost:${GATEWAY_PORT:-8080}}
      - DEFAULT_TEAM_SLUG=${DEFAULT_TEAM_SLUG:-default}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-lgtm:4317
      - PORT=8080
      - HOSTNAME=0.0.0.0

  worker:
    build:
      context: .
      dockerfile: packages/worker/Dockerfile
    init: true
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
      # The gateway syncs the built-in agents, skills and scanner patterns at
      # startup, and the worker refuses to boot until that config exists.
      gateway:
        condition: service_healthy
      # `required: false` so a stack without the `objectstore` profile (hosted
      # S3) still starts the worker.
      garage:
        condition: service_healthy
        required: false
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-engineering_system}
      - TEMPORAL_ADDRESS=temporal:7233
      # LLM provider keys are NOT env vars — they live encrypted in the DB
      # (/admin/model-config) and decrypt with this key, so the worker refuses
      # to boot without it.
      - CONFIG_ENCRYPTION_KEY=${CONFIG_ENCRYPTION_KEY:?CONFIG_ENCRYPTION_KEY is required — generate one with openssl rand -base64 32 and set it in .env}
      # Base URL for the "Open inbox" link in Slack HITL notifications.
      - WEB_URL=${WEB_URL:-http://localhost:${WEB_PORT:-3000}}
      - DEFAULT_TEAM_SLUG=${DEFAULT_TEAM_SLUG:-default}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-lgtm:4317
      # Artifact store — opt in by setting ARTIFACT_S3_BUCKET in your .env.
      # When set, the worker writes artifacts to the Garage container started
      # by docker-compose.infra.yml using S3-compatible APIs.
      - ARTIFACT_S3_BUCKET=${ARTIFACT_S3_BUCKET:-}
      - ARTIFACT_S3_REGION=${ARTIFACT_S3_REGION:-us-east-1}
      - ARTIFACT_S3_ENDPOINT=${ARTIFACT_S3_ENDPOINT:-http://garage:3900}
      - ARTIFACT_S3_FORCE_PATH_STYLE=${ARTIFACT_S3_FORCE_PATH_STYLE:-true}
      - ARTIFACT_S3_PREFIX=${ARTIFACT_S3_PREFIX:-workflow-artifacts}
      # Named ARTIFACT_S3_* on the outside so an ambient AWS_ACCESS_KEY_ID in
      # the developer's shell cannot silently take precedence over `.env`.
      - AWS_ACCESS_KEY_ID=${ARTIFACT_S3_ACCESS_KEY:-autoswelocal}
      - AWS_SECRET_ACCESS_KEY=${ARTIFACT_S3_SECRET_KEY:-autoswelocaldevsecret}
    group_add:
      - "${DOCKER_GID:-999}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock  # DinD access

  # Observability: Grafana LGTM (Grafana + Tempo + Loki + Prometheus + OTel Collector)
  otel-lgtm:
    image: grafana/otel-lgtm:0.30.2
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-127.0.0.1:3001}:3000"   # Grafana UI (3000 taken by Next.js)
      - "${OTLP_GRPC_PORT:-127.0.0.1:4317}:4317" # OTLP gRPC
      - "${OTLP_HTTP_PORT:-127.0.0.1:4318}:4318" # OTLP HTTP

  # Web dashboard
  web:
    build:
      context: .
      dockerfile: packages/web/Dockerfile
    init: true
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      gateway:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      # NEXT_PUBLIC_* are read at request time by the root Server Component and
      # injected into window.__APP_CONFIG__ — no rebuild required to change URLs.
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8080}
      - NEXT_PUBLIC_TEMPORAL_UI_URL=${NEXT_PUBLIC_TEMPORAL_UI_URL:-}
      - NEXT_PUBLIC_GRAFANA_URL=${NEXT_PUBLIC_GRAFANA_URL:-}
      # Server-side fetches (the /admin layout's role check) reach the gateway
      # over the compose network — the browser URL above does not resolve here.
      - API_INTERNAL_URL=${API_INTERNAL_URL:-http://gateway:8080}
      - PORT=3000
      - HOSTNAME=0.0.0.0
