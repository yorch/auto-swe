# Application stack — NOT runnable standalone.
# Services here reference infra (postgres, temporal) defined in docker-compose.infra.yml.
# Always overlay both files: `docker compose -f docker-compose.app.yml -f docker-compose.infra.yml ...`
# Use the `yarn docker:app:up` / `docker:app:down` / `docker:app:logs` / `docker:app:build` scripts for the
# full stack, or `yarn docker:infra:up` for infra only.
services:
  gateway:
    build:
      context: .
      dockerfile: packages/gateway/Dockerfile
    init: true
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-engineering_system}
      - TEMPORAL_ADDRESS=temporal:7233
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET}
      # No insecure fallbacks: the gateway image runs with NODE_ENV=production
      # and refuses the in-source dev secrets, so require real values here.
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required — set a strong random value in .env}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required — set a random value of at least 32 chars in .env}
      - SLACK_CLIENT_ID=${SLACK_CLIENT_ID:-}
      - SLACK_CLIENT_SECRET=${SLACK_CLIENT_SECRET:-}
      - SLACK_SIGNING_SECRET=${SLACK_SIGNING_SECRET:-}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-lgtm:4317
      - PORT=8080
      - HOSTNAME=0.0.0.0

  worker:
    build:
      context: .
      dockerfile: packages/worker/Dockerfile
    init: true
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-engineering_system}
      - TEMPORAL_ADDRESS=temporal:7233
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-lgtm:4317
      # Artifact store — opt in by setting ARTIFACT_S3_BUCKET in your .env.
      # When set, the worker writes artifacts to the MinIO container started
      # by docker-compose.infra.yml using S3-compatible APIs.
      - ARTIFACT_S3_BUCKET=${ARTIFACT_S3_BUCKET:-}
      - ARTIFACT_S3_REGION=${ARTIFACT_S3_REGION:-us-east-1}
      - ARTIFACT_S3_ENDPOINT=${ARTIFACT_S3_ENDPOINT:-http://minio:9000}
      - ARTIFACT_S3_FORCE_PATH_STYLE=${ARTIFACT_S3_FORCE_PATH_STYLE:-true}
      - ARTIFACT_S3_PREFIX=${ARTIFACT_S3_PREFIX:-workflow-artifacts}
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER:-minioadmin}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
    group_add:
      - "${DOCKER_GID:-999}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock  # DinD access

  # Observability: Grafana LGTM (Grafana + Tempo + Loki + Prometheus + OTel Collector)
  otel-lgtm:
    image: grafana/otel-lgtm:0.8.1
    ports:
      - "3001:3000"   # Grafana UI (3000 taken by Next.js)
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP

  # Phase 4: Web Dashboard
  web:
    build:
      context: .
      dockerfile: packages/web/Dockerfile
    init: true
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - gateway
    environment:
      # NEXT_PUBLIC_* are read at request time by the root Server Component and
      # injected into window.__APP_CONFIG__ — no rebuild required to change URLs.
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8080}
      - NEXT_PUBLIC_TEMPORAL_UI_URL=${NEXT_PUBLIC_TEMPORAL_UI_URL:-}
      - PORT=3000
      - HOSTNAME=0.0.0.0
