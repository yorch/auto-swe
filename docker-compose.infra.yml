services:
  postgres:
    image: pgvector/pgvector:${PGVECTOR_TAG:-pg17}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-engineering_system}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Temporal gets its own Postgres to avoid schema conflicts with pgvector
  postgres-temporal:
    image: postgres:${POSTGRES_TEMPORAL_TAG:-17-alpine}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    volumes:
      - ./data/postgres-temporal:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 5

  # One-shot: install Temporal schema into postgres-temporal before the server starts.
  # Replaces the schema-setup step that temporalio/auto-setup used to do internally.
  temporal-setup:
    image: temporalio/admin-tools:${TEMPORAL_ADMINTOOLS_TAG:-1.25.2-tctl-1.18.1-cli-1.1.2}
    depends_on:
      postgres-temporal:
        condition: service_healthy
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PWD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_SEEDS=postgres-temporal
    volumes:
      - ./infra/scripts:/scripts
    entrypoint: ["/bin/sh"]
    command: /scripts/setup-postgres.sh
    restart: on-failure:6

  temporal:
    image: temporalio/server:${TEMPORAL_VERSION:-1.25.2}
    depends_on:
      temporal-setup:
        condition: service_completed_successfully
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PWD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_SEEDS=postgres-temporal
      - BIND_ON_IP=0.0.0.0
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
    ports:
      - "${TEMPORAL_GRPC_PORT:-7233}:7233"
    volumes:
      - ./infra/dynamicconfig:/etc/temporal/config/dynamicconfig
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "7233"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 60

  # One-shot: create the default namespace once Temporal is up.
  # Replaces the namespace-creation step that temporalio/auto-setup used to do.
  temporal-setup-namespace:
    image: temporalio/admin-tools:${TEMPORAL_ADMINTOOLS_TAG:-1.25.2-tctl-1.18.1-cli-1.1.2}
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - DEFAULT_NAMESPACE=${TEMPORAL_NAMESPACE:-default}
    volumes:
      - ./infra/scripts:/scripts
    entrypoint: ["/bin/sh"]
    command: /scripts/create-namespace.sh
    restart: on-failure:5

  # Web UI (was bundled inside auto-setup on 8233; now its own container).
  # Container listens on 8080; mapped to host 8233 to keep our existing
  # TEMPORAL_UI_PORT default and avoid colliding with gateway:8080.
  temporal-ui:
    image: temporalio/ui:${TEMPORAL_UI_VERSION:-2.49.1}
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:${WEB_PORT:-3000}
    ports:
      - "${TEMPORAL_UI_PORT:-8233}:8080"
