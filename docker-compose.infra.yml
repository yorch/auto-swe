# ============================================================================
# SECURITY NOTE — DEV-ONLY DEFAULT CREDENTIALS (SEC-4)
#
# The `:-` fallbacks in this file (POSTGRES_PASSWORD=password,
# MINIO_ROOT_USER/MINIO_ROOT_PASSWORD=minioadmin) exist ONLY so the local
# quickstart (`yarn docker:infra:up`) works out of the box.
#
# NEVER run production on these defaults. The production overlay
# (docker-compose.prod.yml) enforces real values via `${VAR:?...}` — it
# refuses to start unless POSTGRES_PASSWORD, MINIO_ROOT_USER, and
# MINIO_ROOT_PASSWORD are set in `.env`, and those same variables feed the
# services below, so the prod path cannot come up on the dev defaults.
#
# Ports for Postgres (5432), Temporal (7233/8233), and MinIO (9000/9001) are
# published to the host for local development and so the documented runbook
# can run `psql` / `prisma migrate deploy` from the host. To restrict them to
# loopback on a shared host, set e.g. POSTGRES_PORT=127.0.0.1:5432,
# MINIO_API_PORT=127.0.0.1:9000, MINIO_CONSOLE_PORT=127.0.0.1:9001 in `.env`.
# ============================================================================
services:
  postgres:
    image: pgvector/pgvector:${PGVECTOR_TAG:-pg18}
    # !! DEV-ONLY DEFAULT CREDENTIALS — POSTGRES_PASSWORD falls back to
    # !! "password" for local dev. Production MUST override it in `.env`
    # !! (docker-compose.prod.yml makes it mandatory via `:?`).
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-engineering_system}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # pg18 stores data under /var/lib/postgresql/18/docker; mount the parent.
      - ./data/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Temporal gets its own Postgres to avoid schema conflicts with pgvector
  postgres-temporal:
    image: postgres:${POSTGRES_TEMPORAL_TAG:-18-alpine}
    # !! DEV-ONLY DEFAULT CREDENTIALS — same POSTGRES_PASSWORD fallback as the
    # !! `postgres` service above. Production MUST set POSTGRES_PASSWORD.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    volumes:
      # pg18 stores data under /var/lib/postgresql/18/docker; mount the parent.
      - ./data/postgres-temporal:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 5

  # One-shot: install Temporal schema into postgres-temporal before the server starts.
  # Replaces the schema-setup step that temporalio/auto-setup used to do internally.
  temporal-setup:
    image: temporalio/admin-tools:${TEMPORAL_ADMINTOOLS_VERSION:-1.31.2}
    # !! DEV-ONLY DEFAULT CREDENTIALS — POSTGRES_PWD/SQL_PASSWORD fall back to
    # !! "password" for local dev. Production MUST set POSTGRES_PASSWORD.
    depends_on:
      postgres-temporal:
        condition: service_healthy
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PWD=${POSTGRES_PASSWORD:-password}
      - SQL_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_SEEDS=postgres-temporal
    volumes:
      - ./infra/scripts:/scripts
    entrypoint: ["/bin/sh"]
    command: /scripts/setup-postgres.sh
    restart: on-failure:6

  temporal:
    image: temporalio/server:${TEMPORAL_VERSION:-1.31.2}
    # !! DEV-ONLY DEFAULT CREDENTIALS — POSTGRES_PWD falls back to "password"
    # !! for local dev. Production MUST set POSTGRES_PASSWORD.
    depends_on:
      temporal-setup:
        condition: service_completed_successfully
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PWD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_SEEDS=postgres-temporal
      - BIND_ON_IP=0.0.0.0
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
    ports:
      - "${TEMPORAL_GRPC_PORT:-7233}:7233"
    volumes:
      - ./infra/dynamicconfig:/etc/temporal/config/dynamicconfig
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "7233"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 60

  # One-shot: create the default namespace once Temporal is up.
  # Replaces the namespace-creation step that temporalio/auto-setup used to do.
  temporal-setup-namespace:
    image: temporalio/admin-tools:${TEMPORAL_ADMINTOOLS_VERSION:-1.31.2}
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - DEFAULT_NAMESPACE=${TEMPORAL_NAMESPACE:-default}
    volumes:
      - ./infra/scripts:/scripts
    entrypoint: ["/bin/sh"]
    command: /scripts/create-namespace.sh
    restart: on-failure:5

  # Web UI (was bundled inside auto-setup on 8233; now its own container).
  # Container listens on 8080; mapped to host 8233 to keep our existing
  # TEMPORAL_UI_PORT default and avoid colliding with gateway:8080.
  temporal-ui:
    image: temporalio/ui:${TEMPORAL_UI_VERSION:-2.53.3}
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:${WEB_PORT:-3000}
    ports:
      - "${TEMPORAL_UI_PORT:-8233}:8080"

  # MinIO — S3-compatible object store for the artifact backend.
  # Activated locally by setting ARTIFACT_S3_BUCKET / ARTIFACT_S3_ENDPOINT in
  # the worker env (see .env.example). The bucket is created by minio-setup
  # below, so the worker can write artifacts on first start.
  minio:
    image: minio/minio:${MINIO_VERSION:-RELEASE.2025-09-07T16-13-09Z}
    command: server /data --console-address ":9001"
    # !! DEV-ONLY DEFAULT CREDENTIALS — MINIO_ROOT_USER/MINIO_ROOT_PASSWORD
    # !! fall back to "minioadmin"/"minioadmin" for local dev only. Production
    # !! MUST override both in `.env` (docker-compose.prod.yml makes them
    # !! mandatory via `:?` because the worker derives its AWS_* creds from
    # !! these same variables).
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - ./data/minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # One-shot: create the artifact bucket once MinIO is up so the worker can
  # use the S3 backend out-of-the-box. Idempotent — re-runs are a no-op.
  minio-setup:
    image: minio/mc:${MINIO_MC_VERSION:-RELEASE.2025-08-13T08-35-41Z}
    # !! DEV-ONLY DEFAULT CREDENTIALS — see the `minio` service note above.
    depends_on:
      minio:
        condition: service_healthy
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
      - ARTIFACT_S3_BUCKET=${ARTIFACT_S3_BUCKET:-auto-swe-artifacts}
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" &&
       mc mb --ignore-existing \"local/$$ARTIFACT_S3_BUCKET\" &&
       echo \"MinIO bucket ready: $$ARTIFACT_S3_BUCKET\""
    restart: on-failure:5
